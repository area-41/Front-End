<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Viagens</title>
  </head>
  <body>
    <!doctype html>
    <html lang="pt-BR">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Simulador de Viagens</title>
      </head>
      <body>
        <header>
          <h1>Simulador de Viagens Web</h1>
          <nav>
            <a href="#busca">Buscar</a> | <a href="#destinos">Destinos</a> |
            <a href="#sobre">Sobre</a>
          </nav>
        </header>

        <main>
          <section id="busca">
            <h2>Planeje sua Rota</h2>
            <p>Formulário de busca entrará aqui...</p>
          </section>

          <section id="destinos">
            <h2>Destinos Populares</h2>
            <ul>
              <li>Paris</li>
              <li>Londres</li>
              <li>Tóquio</li>
            </ul>
            <img
              src="https://placehold.co/300x200/FFD700/000000?text=Viagem"
              alt="Banner ilustrativo de uma mala de viagem e um mapa"
            />
          </section>
        </main>

        <footer>
          <p>Simulador de Viagens | Especialização em Python</p>
        </footer>
      </body>
    </html>
  </body>
</html>
